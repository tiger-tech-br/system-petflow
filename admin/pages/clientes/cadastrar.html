<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <!-- ==================================================
         META TAGS
    =================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PetFlow • Cadastrar Cliente</title>

    <!-- ==================================================
         CSS
    =================================================== -->

    <link
        rel="stylesheet"
        href="/css/base/main.css">

    <!-- ==================================================
         FONT AWESOME
    =================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="/css/pages/admin-pages.css"></head>

<body>

    <!-- ==================================================
         WRAPPER
    =================================================== -->

    <div class="admin-wrapper">

        <!-- Sidebar -->

        <aside id="sidebar"></aside>

        <!-- ==================================================
             MAIN
        =================================================== -->

        <main class="main-content">

            <!-- Header -->

            <header id="header"></header>

            <!-- ==================================================
                 CONTEÚDO
            =================================================== -->

            <section class="page-container">

                <!-- ==========================================
                     CABEÇALHO
                =========================================== -->

                <div class="page-header">

                    <div class="page-title">

                        <div class="page-title-header">

                            <i class="fa-solid fa-user-plus"></i>

                            <h1>Cadastrar Cliente</h1>

                        </div>

                        <p>

                            Cadastre novos clientes para gerenciar
                            seus dados e seus pets no sistema.

                        </p>

                    </div>

                    <div class="page-actions">

                        <a
                            href="./clientes.html"
                            class="btn btn-secondary">

                            <i class="fa-solid fa-arrow-left"></i>

                            Voltar

                        </a>

                    </div>

                </div>

                <!-- ==========================================
                     FORMULÁRIO
                =========================================== -->

                <form
                    id="formCliente"
                    autocomplete="off">

                                    <!-- ==========================================
                         DADOS PESSOAIS
                    =========================================== -->

                    <section class="card cliente-card">

                        <h2>

                            <i class="fa-solid fa-id-card"></i>

                            Dados Pessoais

                        </h2>

                        <div class="cliente-form-grid">

                            <!-- Nome -->

                            <div class="form-group">

                                <label for="nome">

                                    Nome Completo <span>*</span>

                                </label>

                                <input
                                    type="text"
                                    id="nome"
                                    name="nome"
                                    class="form-control"
                                    placeholder="Digite o nome completo"
                                    autocomplete="name"
                                    autocapitalize="words"
                                    spellcheck="false"
                                    maxlength="120"
                                    minlength="3"
                                    required>

                            </div>

                            <!-- CPF -->

                            <div class="form-group">

                                <label for="cpf">

                                    CPF

                                </label>

                                <input
                                    type="text"
                                    id="cpf"
                                    name="cpf"
                                    class="form-control"
                                    placeholder="000.000.000-00">

                            </div>

                            <!-- RG -->

                            <div class="form-group">

                                <label for="rg">

                                    RG

                                </label>

                                <input
                                    type="text"
                                    id="rg"
                                    name="rg"
                                    class="form-control"
                                    placeholder="00.000.000-0">

                            </div>

                            <!-- Data de nascimento -->

                            <div class="form-group">

                                <label for="dataNascimento">

                                    Data de Nascimento

                                </label>

                                <input
                                    type="date"
                                    id="dataNascimento"
                                    name="dataNascimento"
                                    class="form-control">

                            </div>

                            <!-- Sexo -->

                            <div class="form-group">

                                <label for="sexo">

                                    Sexo

                                </label>

                                <select
                                    id="sexo"
                                    name="sexo"
                                    class="form-control">

                                    <option value="">Selecione</option>

                                    <option value="M">Masculino</option>

                                    <option value="F">Feminino</option>

                                    <option value="O">Outro</option>

                                </select>

                            </div>

                        </div>

                    </section>


                                        <!-- ==========================================
                         CONTATO
                    =========================================== -->

                    <section class="card cliente-card">

                        <h2>

                            <i class="fa-solid fa-phone"></i>

                            Contato

                        </h2>

                        <div class="cliente-form-grid">

                            <!-- Telefone -->

                            <div class="form-group">

                                <label for="telefone">

                                    Telefone <span>*</span>

                                </label>

                                <input
                                    type="tel"
                                    id="telefone"
                                    name="telefone"
                                    class="form-control"
                                    placeholder="(11) 99999-9999"
                                    autocomplete="tel-national"
                                    inputmode="tel"
                                    maxlength="15"
                                    required>

                            </div>

                            <!-- WhatsApp -->

                            <div class="form-group">

                                <label for="whatsapp">

                                    WhatsApp

                                </label>

                                <input
                                    type="tel"
                                    id="whatsapp"
                                    name="whatsapp"
                                    class="form-control"
                                    placeholder="(11) 99999-9999"
                                    autocomplete="tel-national"
                                    inputmode="tel"
                                    maxlength="15">

                            </div>

                            <!-- E-mail -->

                            <div class="form-group">

                                <label for="email">

                                    E-mail

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="cliente@email.com"
                                    autocomplete="email"
                                    spellcheck="false"
                                    maxlength="150">

                            </div>

                        </div>

                    </section>

                                        <!-- ==========================================
                         ENDEREÇO
                    =========================================== -->

                    <section class="card cliente-card">

                        <h2>

                            <i class="fa-solid fa-location-dot"></i>

                            Endereço

                        </h2>

                        <div class="cliente-form-grid">

                            <!-- CEP -->

                            <div class="form-group">

                                <label for="cep">

                                    CEP

                                </label>

                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    class="form-control"
                                    placeholder="00000-000"
                                    inputmode="numeric"
                                    maxlength="9">

                            </div>

                            <!-- Rua -->

                            <div class="form-group">

                                <label for="rua">

                                    Rua

                                </label>

                                <input
                                    type="text"
                                    id="rua"
                                    name="rua"
                                    class="form-control"
                                    placeholder="Digite a rua">

                            </div>

                            <!-- Número -->

                            <div class="form-group">

                                <label for="numero">

                                    Número

                                </label>

                                <input
                                    type="text"
                                    id="numero"
                                    name="numero"
                                    class="form-control"
                                    placeholder="Número">

                            </div>

                            <!-- Complemento -->

                            <div class="form-group">

                                <label for="complemento">

                                    Complemento

                                </label>

                                <input
                                    type="text"
                                    id="complemento"
                                    name="complemento"
                                    class="form-control"
                                    placeholder="Apartamento, bloco, etc.">

                            </div>

                            <!-- Bairro -->

                            <div class="form-group">

                                <label for="bairro">

                                    Bairro

                                </label>

                                <input
                                    type="text"
                                    id="bairro"
                                    name="bairro"
                                    class="form-control"
                                    placeholder="Digite o bairro">

                            </div>

                            <!-- Cidade -->

                            <div class="form-group">

                                <label for="cidade">

                                    Cidade

                                </label>

                                <input
                                    type="text"
                                    id="cidade"
                                    name="cidade"
                                    class="form-control"
                                    placeholder="Digite a cidade">

                            </div>

                            <!-- Estado -->

                            <div class="form-group">

                                <label for="estado">

                                    Estado

                                </label>

                                <select
                                    id="estado"
                                    name="estado"
                                    class="form-control">

                                    <option value="">Selecione</option>

                                    <option value="AC">Acre</option>
                                    <option value="AL">Alagoas</option>
                                    <option value="AP">Amapá</option>
                                    <option value="AM">Amazonas</option>
                                    <option value="BA">Bahia</option>
                                    <option value="CE">Ceará</option>
                                    <option value="DF">Distrito Federal</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="GO">Goiás</option>
                                    <option value="MA">Maranhão</option>
                                    <option value="MT">Mato Grosso</option>
                                    <option value="MS">Mato Grosso do Sul</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="PA">Pará</option>
                                    <option value="PB">Paraíba</option>
                                    <option value="PR">Paraná</option>
                                    <option value="PE">Pernambuco</option>
                                    <option value="PI">Piauí</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="RN">Rio Grande do Norte</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="RO">Rondônia</option>
                                    <option value="RR">Roraima</option>
                                    <option value="SC">Santa Catarina</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="SE">Sergipe</option>
                                    <option value="TO">Tocantins</option>

                                </select>

                            </div>

                        </div>

                    </section>


                                        <!-- ==========================================
                         DADOS DO PET
                    =========================================== -->

                    <section class="card cliente-card">

                        <h2>

                            <i class="fa-solid fa-paw"></i>

                            Dados do Pet

                        </h2>

                        <div class="cliente-form-grid">

                            <!-- Nome -->

                            <div class="form-group">

                                <label for="petNome">

                                    Nome do Pet <span>*</span>

                                </label>

                                <input
                                    type="text"
                                    id="petNome"
                                    name="petNome"
                                    class="form-control"
                                    placeholder="Ex.: Rex"
                                    maxlength="80"
                                    required>

                            </div>

                            <!-- Espécie -->

                            <div class="form-group">

                                <label for="especie">

                                    Espécie <span>*</span>

                                </label>

                                <select
                                    id="especie"
                                    name="especie"
                                    class="form-control"
                                    required>

                                    <option value="">Selecione</option>

                                    <option value="cachorro">Cachorro</option>

                                    <option value="gato">Gato</option>

                                    <option value="ave">Ave</option>

                                    <option value="coelho">Coelho</option>

                                    <option value="roedor">Roedor</option>

                                    <option value="réptil">Réptil</option>

                                    <option value="outro">Outro</option>

                                </select>

                            </div>

                            <!-- Raça -->

                            <div class="form-group">

                                <label for="raca">

                                    Raça

                                </label>

                                <input
                                    type="text"
                                    id="raca"
                                    name="raca"
                                    class="form-control"
                                    placeholder="Ex.: Golden Retriever">

                            </div>

                            <!-- Sexo -->

                            <div class="form-group">

                                <label for="petSexo">

                                    Sexo

                                </label>

                                <select
                                    id="petSexo"
                                    name="petSexo"
                                    class="form-control">

                                    <option value="">Selecione</option>

                                    <option value="M">Macho</option>

                                    <option value="F">Fêmea</option>

                                </select>

                            </div>

                            <!-- Data de nascimento -->

                            <div class="form-group">

                                <label for="petNascimento">

                                    Data de Nascimento

                                </label>

                                <input
                                    type="date"
                                    id="petNascimento"
                                    name="petNascimento"
                                    class="form-control">

                            </div>

                            <!-- Peso -->

                            <div class="form-group">

                                <label for="peso">

                                    Peso (kg)

                                </label>

                                <input
                                    type="number"
                                    id="peso"
                                    name="peso"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="0,00">

                            </div>

                            <!-- Cor -->

                            <div class="form-group">

                                <label for="cor">

                                    Cor

                                </label>

                                <input
                                    type="text"
                                    id="cor"
                                    name="cor"
                                    class="form-control"
                                    placeholder="Ex.: Caramelo">

                            </div>

                            <!-- Castrado -->

                            <div class="form-group">

                                <label for="castrado">

                                    Castrado

                                </label>

                                <select
                                    id="castrado"
                                    name="castrado"
                                    class="form-control">

                                    <option value="">Selecione</option>

                                    <option value="sim">Sim</option>

                                    <option value="nao">Não</option>

                                </select>

                            </div>

                            <!-- Observações -->

                            <div class="form-group"
                                 style="grid-column:1 / -1;">

                                <label for="petObservações">

                                    Observações do Pet

                                </label>

                                <textarea
                                    id="petObservações"
                                    name="petObservações"
                                    class="form-control"
                                    rows="4"
                                    maxlength="500"
                                    placeholder="Alergias, comportamento, necessidades especiais..."></textarea>

                            </div>

                        </div>

                    </section>

                                        <!-- ==========================================
                         OBSERVAÇÕES DO CLIENTE
                    =========================================== -->

                    <section class="card cliente-card">

                        <h2>

                            <i class="fa-solid fa-note-sticky"></i>

                            Observações do Cliente

                        </h2>

                        <div class="form-group">

                            <label for="observacoes">

                                Observações

                            </label>

                            <textarea
                                id="observacoes"
                                name="observacoes"
                                class="form-control"
                                rows="5"
                                maxlength="500"
                                placeholder="Informações adicionais sobre o cliente..."></textarea>

                        </div>

                    </section>

                    <!-- ==========================================
                         STATUS
                    =========================================== -->

                    <section class="card cliente-card">

                        <h2>

                            <i class="fa-solid fa-circle-check"></i>

                            Status

                        </h2>

                        <div class="form-group">

                            <label for="status">

                                Situação do cadastro

                            </label>

                            <select
                                id="status"
                                name="status"
                                class="form-control">

                                <option value="ativo">

                                    Ativo

                                </option>

                                <option value="inativo">

                                    Inativo

                                </option>

                            </select>

                        </div>

                    </section>

                    <!-- ==========================================
                         BOTÕES
                    =========================================== -->

                    <section class="cliente-form-actions">

                        <button
                            type="reset"
                            class="btn btn-outline">

                            <i class="fa-solid fa-eraser"></i>

                            Limpar

                        </button>

                        <a
                            href="./clientes.html"
                            class="btn btn-secondary">

                            <i class="fa-solid fa-xmark"></i>

                            Cancelar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Salvar Cliente

                        </button>

                    </section>

                </form>

            </section>

        </main>

    </div>

    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script
        src="/js/main.js"
        defer></script>

    <script
        src="/js/pages/clientes/cadastrar.js"
        defer></script>

</body>

</html>
