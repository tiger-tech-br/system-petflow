<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta PetFlow para acompanhar pedidos, ofertas e cuidados do seu pet.">
    <meta name="keywords" content="petflow, login, conta pet shop">
    <meta name="author" content="Tiger Tech">

    <title>PetFlow | Entrar</title>

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/pages/public-login.css">
</head>

<body>
    <a class="back-home" href="/">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar para a loja
    </a>

    <main class="login-container">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <a class="login-logo" href="/" aria-label="Voltar para a página inicial">
                    <img src="/images/logo/fred-petflow-logo-transparent.png" alt="Logo PetFlow" width="88" height="88">
                </a>

                <span class="login-eyebrow">Área do cliente</span>

                <h1 id="login-title">Entre na sua conta PetFlow</h1>

                <p>Acompanhe pedidos, favorite produtos e receba ofertas pensadas para o seu pet.</p>
            </header>

            <form id="publicLoginForm" class="login-form" autocomplete="on" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        class="form-control"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        maxlength="150"
                        required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        class="form-control"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        minlength="6"
                        maxlength="50"
                        required>
                </div>

                <div class="form-row">
                    <label class="form-check" for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Permanecer conectado</span>
                    </label>

                    <a href="#">Esqueci minha senha</a>
                </div>

                <button class="btn btn-primary" type="submit">
                    Entrar
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p class="login-note">
                    Ainda não tem conta?
                    <a href="#">Criar cadastro</a>
                </p>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("publicLoginForm").addEventListener("submit", (event) => {
            event.preventDefault();
            alert("Login de cliente em preparação. O painel administrativo continua em /admin.");
        });
    </script>
</body>

</html>
